name: Build the skyline

on:
  schedule:
    - cron: '17 */6 * * *' # every 6 hours, off the top of the hour
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: skyline
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - run: npm test

      - run: npm run render
        env:
          SKYLINE_TOKEN: ${{ secrets.SKYLINE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SKYLINE_USER: ${{ github.repository_owner }}

      # Keep the SVG on its own single-commit branch so main's history doesn't grow every run.
      - name: Publish to the output branch
        working-directory: dist
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skyline.svg
          git commit -q -m "Skyline at $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" output
